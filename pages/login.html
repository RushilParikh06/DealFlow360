<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <style>
    @layer base {

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        overscroll-behavior: none;
      }

      main>:first-child {
        margin-top: 0 !important;
      }

      main>:last-child {
        margin-bottom: 0 !important;
      }
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script
    id="tailwind-config">tailwind.config = { "darkMode": "class", "theme": { "extend": { "colors": { "on-secondary-container": "#5e6573", "on-background": "#191b23", "on-secondary-fixed-variant": "#404754", "tertiary-fixed-dim": "#ffb597", "on-tertiary-fixed-variant": "#7e2c00", "surface-variant": "#e2e1ec", "surface-container-lowest": "#ffffff", "secondary-container": "#dce2f3", "secondary": "#585f6c", "primary-container": "#E0E7FA", "outline-variant": "#c3c5d7", "on-tertiary-fixed": "#360f00", "on-tertiary-container": "#ffd5c5", "on-primary-container": "#173E9D", "surface": "#F4F0E7", "inverse-primary": "#b5c4ff", "primary": "#003fb3", "on-tertiary": "#ffffff", "error-container": "#FEE2E2", "surface-container-highest": "#e2e1ec", "on-surface": "#191b23", "surface-container-low": "#f3f3fe", "surface-container-high": "#e7e7f2", "on-primary-fixed-variant": "#003cad", "on-surface-variant": "#434654", "primary-fixed-dim": "#b5c4ff", "tertiary-fixed": "#ffdbcd", "background": "#faf8ff", "surface-dim": "#E9E3D8", "tertiary": "#832f00", "surface-container": "#ededf8", "on-error-container": "#93000a", "surface-bright": "#FFFCF5", "inverse-surface": "#2e3038", "surface-tint": "#1f54d3", "outline": "#1D2430", "on-primary": "#ffffff", "error": "#DC2626", "inverse-on-surface": "#f0f0fb", "secondary-fixed-dim": "#c0c7d7", "tertiary-container": "#aa3f00", "primary-fixed": "#dce1ff", "on-secondary-fixed": "#151c27", "secondary-fixed": "#dce2f3", "on-error": "#ffffff", "on-secondary": "#ffffff", "on-primary-fixed": "#00164d" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-xs": "0.5rem", "space-xxs": "0.25rem", "space-lg": "1.5rem", "gutter": "1rem", "border-width": "1.5px", "space-xl": "2rem", "space-sm": "0.75rem", "space-md": "1rem", "margin-mobile": "1rem", "margin-desktop": "2rem", "space-2xl": "3rem" }, "fontFamily": { "label-sm": ["IBM Plex Sans"], "mono-metric-sm": ["Courier Prime"], "body-lg": ["IBM Plex Sans"], "headline-md": ["IBM Plex Sans"], "label-md": ["IBM Plex Sans"], "body-md": ["IBM Plex Sans"], "headline-lg-mobile": ["IBM Plex Sans"], "mono-metric": ["Courier Prime"], "body-sm": ["IBM Plex Sans"], "headline-lg": ["IBM Plex Sans"], "headline-sm": ["IBM Plex Sans"] }, "fontSize": { "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "mono-metric-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "mono-metric": ["14px", { "lineHeight": "20px", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }] } } } }</script>
  <link href="../assets/css/app.css" rel="stylesheet" />
  <script defer src="../assets/js/app.js"></script>
</head>

<body class="bg-surface font-body-md text-body-md text-on-surface flex items-center justify-center min-h-screen">
  <main class="w-full max-w-6xl px-space-md py-space-xl md:px-space-xl">
    <div class="flex flex-col w-full max-w-5xl mx-auto">
      <div
        class="w-full bg-surface-bright border-[2px] border-outline shadow-sm rounded-lg overflow-hidden flex flex-col md:flex-row">
        <!-- Left Brand & Context Panel -->
        <div
          class="w-full md:w-5/12 bg-surface-dim p-space-lg md:p-space-xl flex flex-col justify-between border-b-[2px] md:border-b-0 md:border-r-[2px] border-outline">
          <div class="flex flex-col">
            <h1
              class="font-headline-lg text-headline-lg text-on-surface tracking-tight uppercase leading-none mb-space-xs">
              DealFlow360
            </h1>
            <p class="font-body-md text-body-md text-on-surface-variant leading-snug mb-space-lg">
              Unified Deal Governance, CPQ &amp; Operations Platform.
            </p>
            <!-- Access Segment Switchers / Role Selectors -->
            <div class="flex flex-col gap-space-sm">
              <!-- Internal Staff Workspace Option -->
              <button
                class="text-left w-full p-space-sm bg-surface-bright border border-outline shadow-sm"
                id="role-internal" aria-pressed="true" onclick="selectRole('internal')" type="button">
                <div class="flex items-center justify-between">
                  <span class="font-label-md text-label-md font-semibold text-on-surface flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px] text-primary">corporate_fare</span>
                    Internal Staff Workspace
                  </span>
                  <span
                    class="text-[10px] font-mono-metric bg-primary-container text-on-primary-container px-1 border border-outline"
                    id="badge-internal">ACTIVE</span>
                </div>
              </button>
              <!-- Customer Portal Access Option -->
              <button
                class="text-left w-full p-space-sm bg-surface border border-outline opacity-75 hover:opacity-100 hover:bg-surface-bright transition-colors"
                id="role-customer" aria-pressed="false" onclick="selectRole('customer')" type="button">
                <div class="flex items-center justify-between">
                  <span class="font-label-md text-label-md font-semibold text-on-surface flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px] text-secondary">verified_user</span>
                    Customer Portal Access
                  </span>
                  <span
                    class="text-[10px] font-mono-metric bg-surface-variant text-on-surface-variant px-1 border border-outline hidden"
                    id="badge-customer">STANDBY</span>
                </div>
              </button>
            </div>
          </div>
        </div>
        <!-- Right Authentication Interactive Panel -->
        <div class="w-full md:w-7/12 bg-surface-bright p-space-lg md:p-space-xl flex flex-col justify-between">
          <div>
            <!-- Mode Tabs -->
            <div class="flex border-b border-outline mb-space-md">
              <button
                class="font-label-md text-label-md uppercase tracking-wider py-space-xs px-space-md bg-surface-bright border-t-[2px] border-l-[2px] border-r-[2px] border-outline -mb-[1px] font-bold text-primary flex items-center gap-1.5"
                id="tab-signin" aria-pressed="true" onclick="switchAuthTab('signin')" type="button">
                <span class="material-symbols-outlined text-[16px]">login</span>
                Sign In
              </button>
              <button
                class="font-label-md text-label-md uppercase tracking-wider py-space-xs px-space-md bg-surface text-secondary hover:text-on-surface transition-colors border-b border-outline"
                id="tab-signup" aria-pressed="false" onclick="switchAuthTab('signup')" type="button">
                Sign Up
              </button>
            </div>
            <form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
              <!-- Target Workspace Selection -->
              <div class="flex flex-col gap-1">
                <label
                  class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface flex items-center justify-between"
                  for="workspace-select">
                  <span>Target Organization</span>
                </label>
                <div class="relative">
                  <select
                    class="w-full bg-surface-container-lowest border border-outline rounded-none px-space-sm py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:shadow-sm appearance-none pr-8"
                    id="workspace-select">
                    <option value="acme-prod">Acme Enterprise (Production)</option>
                  </select>
                  <span
                    class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface text-[18px]">
                    unfold_more
                  </span>
                </div>
              </div>
              <!-- Work Email Input -->
              <div class="flex flex-col gap-1">
                <label
                  class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface flex items-center justify-between"
                  for="work-email">
                  <span>Work Email</span>
                </label>
                <div class="relative flex items-center">
                  <input
                    class="w-full bg-surface-container-lowest border border-outline rounded-none px-space-sm py-2 font-mono-metric text-mono-metric text-on-surface focus:outline-none focus:border-primary focus:shadow-sm"
                    id="work-email" required="" type="email" autocomplete="username"
                    placeholder="manager@dealflow.test" value="manager@dealflow.test" />
                </div>
              </div>
              <!-- Password Input -->
              <div class="flex flex-col gap-1">
                <div class="flex items-center justify-between">
                  <label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface"
                    for="password-input">Password</label>
                  <a data-unavailable="Password recovery is not available yet. Contact your workspace administrator." aria-disabled="true" class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
                </div>
                <div class="relative flex items-center">
                  <input
                    class="w-full bg-surface-container-lowest border border-outline rounded-none px-space-sm py-2 font-mono-metric text-mono-metric text-on-surface focus:outline-none focus:border-primary focus:shadow-sm pr-10"
                    id="password-input" required="" type="password" autocomplete="current-password"
                    placeholder="dealflow123" value="" />
                  <button aria-label="Show password" aria-pressed="false"
                    class="absolute right-2.5 text-on-surface-variant hover:text-on-surface focus:outline-none"
                    onclick="togglePasswordVisibility()" type="button">
                    <span class="material-symbols-outlined text-[18px]" id="eye-icon">visibility</span>
                  </button>
                </div>
              </div>
              <!-- Seeded demo accounts. The demo dataset ships with these; every one uses dealflow123. -->
              <div
                class="border border-outline bg-surface-container-lowest px-space-sm py-space-xs font-mono-metric-sm text-mono-metric-sm text-on-surface-variant leading-relaxed">
                <span class="uppercase tracking-wider text-on-surface">Demo accounts</span> &mdash; password
                <span class="text-on-surface">dealflow123</span><br />
                manager@dealflow.test &middot; rep@dealflow.test &middot; ops@dealflow.test &middot;
                finance@dealflow.test
              </div>
              <!-- Primary CTA Action -->
              <button
                class="mt-space-xs w-full py-2.5 px-space-md bg-primary text-on-primary font-headline-sm text-headline-sm uppercase tracking-wider border-[2px] border-outline shadow-[2px_2px_0px_#1D2430] hover:opacity-90 transition-opacity flex items-center justify-center gap-space-xs"
                id="submit-btn" type="submit">
                <span>Sign In</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
              </button>
            </form>
          </div>
        </div>
      </div>
      <script>
        function togglePasswordVisibility() {
          const input = document.getElementById('password-input');
          const icon = document.getElementById('eye-icon');
          const button = icon.closest('button');
          button.setAttribute('aria-label', input.type === 'password' ? 'Hide password' : 'Show password');
          button.setAttribute('aria-pressed', String(input.type === 'password'));
          if (input.type === 'password') {
            input.type = 'text';
            icon.innerText = 'visibility_off';
          } else {
            input.type = 'password';
            icon.innerText = 'visibility';
          }
        }

        function selectRole(role) {
          const internalCard = document.getElementById('role-internal');
          const customerCard = document.getElementById('role-customer');
          const badgeInternal = document.getElementById('badge-internal');
          const badgeCustomer = document.getElementById('badge-customer');
          internalCard.setAttribute('aria-pressed', String(role === 'internal'));
          customerCard.setAttribute('aria-pressed', String(role === 'customer'));
          badgeCustomer.textContent = 'ACTIVE';

          if (role === 'internal') {
            internalCard.className = "text-left w-full p-space-sm bg-surface-bright border border-outline shadow-sm";
            customerCard.className = "text-left w-full p-space-sm bg-surface border border-outline opacity-75 hover:opacity-100 hover:bg-surface-bright transition-colors";
            badgeInternal.classList.remove('hidden');
            badgeCustomer.classList.add('hidden');
          } else {
            customerCard.className = "text-left w-full p-space-sm bg-surface-bright border border-outline shadow-sm";
            internalCard.className = "text-left w-full p-space-sm bg-surface border border-outline opacity-75 hover:opacity-100 hover:bg-surface-bright transition-colors";
            badgeCustomer.classList.remove('hidden');
            badgeInternal.classList.add('hidden');
          }
        }

        function switchAuthTab(tab) {
          const signinBtn = document.getElementById('tab-signin');
          const signupBtn = document.getElementById('tab-signup');
          const submitBtn = document.getElementById('submit-btn');
          signinBtn.setAttribute('aria-pressed', String(tab === 'signin'));
          signupBtn.setAttribute('aria-pressed', String(tab === 'signup'));
          document.getElementById('password-input').autocomplete = tab === 'signup' ? 'new-password' : 'current-password';

          if (tab === 'signin') {
            signinBtn.className = "font-label-md text-label-md uppercase tracking-wider py-space-xs px-space-md bg-surface-bright border-t-[2px] border-l-[2px] border-r-[2px] border-outline -mb-[1px] font-bold text-primary flex items-center gap-1.5";
            signupBtn.className = "font-label-md text-label-md uppercase tracking-wider py-space-xs px-space-md bg-surface text-secondary hover:text-on-surface transition-colors border-b border-outline";
            submitBtn.querySelector('span').innerText = 'Sign In';
          } else {
            signupBtn.className = "font-label-md text-label-md uppercase tracking-wider py-space-xs px-space-md bg-surface-bright border-t-[2px] border-l-[2px] border-r-[2px] border-outline -mb-[1px] font-bold text-primary flex items-center gap-1.5";
            signinBtn.className = "font-label-md text-label-md uppercase tracking-wider py-space-xs px-space-md bg-surface text-secondary hover:text-on-surface transition-colors border-b border-outline";
            submitBtn.querySelector('span').innerText = 'Sign Up';
          }
        }
      </script>
    </div>
  </main>
</body>

</html>
